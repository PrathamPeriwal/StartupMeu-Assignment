services:
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      MONGO_URL: mongodb://mongo:27017/jobtrail
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      - mongo
volumes:
  mongo-data:
